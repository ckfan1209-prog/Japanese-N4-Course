<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日語 N4 六個月計劃</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: "Hiragino Sans", "Noto Sans TC", -apple-system, sans-serif; background:#f0f4f8; color:#2d3748; }
header { background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:#fff; padding:2rem 1rem; text-align:center; }
header h1 { font-size:1.6rem; margin-bottom:.5rem; }
header p { opacity:.9; font-size:.9rem; }
.progress-wrap { background:rgba(255,255,255,.2); border-radius:20px; height:14px; margin:1rem auto 0; max-width:300px; overflow:hidden; }
.progress-bar { background:#fff; height:100%; border-radius:20px; transition:width .5s; }
main { max-width:600px; margin:0 auto; padding:1rem; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:.75rem; }
.card { background:#fff; border-radius:14px; padding:1rem; text-decoration:none; color:inherit; box-shadow:0 2px 8px rgba(0,0,0,.06); position:relative; transition:transform .15s; }
.card:active { transform:scale(.97); }
.card-day { font-weight:700; font-size:1.05rem; color:#5a67d8; }
.card-date { font-size:.75rem; color:#a0aec0; }
.card-theme { font-size:.78rem; color:#718096; margin-top:.25rem; line-height:1.3; }
.badge { display:inline-block; font-size:.65rem; padding:.15rem .5rem; border-radius:10px; margin-top:.4rem; }
.badge.test { background:#fed7d7; color:#c53030; }
footer { text-align:center; padding:2rem; color:#a0aec0; font-size:.8rem; }
</style>
</head>

        <a class="card" href="day4.html">
