<style>
:root {
  --bg:#f4f5fb; --card:#ffffff; --text:#1e2235; --muted:#8b90a7;
  --primary:#6366f1; --primary-soft:#eef0ff;
  --quiz:#ef4444; --listen:#10b981; --radius:18px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:-apple-system,"PingFang TC","Noto Sans TC","Hiragino Sans",sans-serif; background:var(--bg); color:var(--text); }
header { background:linear-gradient(140deg,#6366f1 0%,#8b5cf6 55%,#a855f7 100%); color:#fff; padding:2.2rem 1.2rem 1.6rem; border-radius:0 0 28px 28px; }
.header-row { display:flex; justify-content:space-between; align-items:center; }
header h1 { font-size:1.45rem; font-weight:800; letter-spacing:.5px; }
header .sub { opacity:.85; font-size:.82rem; margin-top:.3rem; }
.ring { width:74px; height:74px; border-radius:50%; background:conic-gradient(#fff calc(var(--p)*1%), rgba(255,255,255,.25) 0); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.ring-in { width:58px; height:58px; border-radius:50%; background:#7c62f0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.ring-in b { font-size:1.05rem; }
.ring-in span { font-size:.55rem; opacity:.8; }
.stats { display:flex; gap:.6rem; margin-top:1.1rem; }
.stat { flex:1; background:rgba(255,255,255,.16); backdrop-filter:blur(6px); border-radius:14px; padding:.6rem .8rem; }
.stat b { font-size:1.15rem; display:block; }
.stat span { font-size:.68rem; opacity:.8; }
main { max-width:560px; margin:0 auto; padding:1rem .9rem 5rem; }
.sec-title { font-size:.95rem; font-weight:700; margin:1.2rem 0 .7rem; display:flex; align-items:center; gap:.4rem; }
.sec-title .dot { width:8px; height:8px; border-radius:50%; background:var(--primary); }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; }
.card { background:var(--card); border-radius:var(--radius); padding:.95rem 1rem; text-decoration:none; color:inherit; box-shadow:0 1px 3px rgba(30,34,53,.06),0 4px 14px rgba(30,34,53,.05); transition:transform .12s; display:block; position:relative; overflow:hidden; }
.card:active { transform:scale(.96); }
.card-top { display:flex; justify-content:space-between; align-items:baseline; }
.card-day { font-weight:800; font-size:1.08rem; color:var(--primary); }
.card-wd { font-size:.75rem; color:var(--muted); }
.card-date { font-size:.72rem; color:var(--muted); margin-top:.15rem; }
.card-theme { font-size:.76rem; color:#5b6072; margin-top:.35rem; line-height:1.35; }
.chip { display:inline-block; font-size:.64rem; padding:.18rem .55rem; border-radius:99px; margin-top:.5rem; font-weight:600; }
.card.quiz .chip { background:#fee2e2; color:var(--quiz); }
.card.listen .chip { background:#d1fae5; color:var(--listen); }
footer { text-align:center; padding:1.5rem; color:var(--muted); font-size:.72rem; }
@media (min-width:480px) { .grid { grid-template-columns:1fr 1fr 1fr; } }

<script>
var _jaVoice=null;
function pickVoice(){
  var vs=speechSynthesis.getVoices();
  if(!vs.length)return null;
  var ja=vs.filter(function(v){return /^ja(-|_)JP/i.test(v.lang)||v.lang==='ja';});
  if(!ja.length)return null;
  // Preference order: local enhanced/premium voices first, then known-good names
  function score(v){
    var s=0, n=v.name.toLowerCase();
    if(v.localService)s+=40;
    if(/premium|enhanced|elite|neural/.test(n))s+=50;
    if(/o-ren|oren/.test(n))s+=30;
    if(/kyoko/.test(n))s+=25;
    if(/google/.test(n))s+=20;   // Chrome's Google Japanese voice is quite natural
    if(/siri/.test(n))s+=15;
    return s;
  }
  ja.sort(function(a,b){return score(b)-score(a);});
  return ja[0];
}
speechSynthesis.onvoiceschanged=function(){_jaVoice=pickVoice();};
function speak(el){
  try{
    var t=(el.dataset.speak||el.textContent||'').replace(/\s+/g,' ').trim();
    if(!('speechSynthesis' in window)){alert('你個瀏覽器唔支援語音朗讀');return;}
    if(!_jaVoice)_jaVoice=pickVoice();
    var u=new SpeechSynthesisUtterance(t);
    u.lang='ja-JP';
    if(_jaVoice)u.voice=_jaVoice;
    u.rate=0.85; u.pitch=1.0;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
    el.classList.add('speaking');
    u.onend=function(){el.classList.remove('speaking');};
  }catch(e){}
}
</script>
