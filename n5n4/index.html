<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#c9403b">
<title>N5→N4 九十二日課程｜Pison自編</title>
<style>
:root{
  --bg:#faf7f2; --card:#ffffff; --text:#2b2620; --muted:#97907f;
  --primary:#c9403b; --primary-soft:#fdeeee; --primary-deep:#a93229;
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang TC","Noto Sans TC","Hiragino Sans",sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
header{background:linear-gradient(140deg,#c9403b 0%,#d9534a 55%,#e07a3f 100%);color:#fff;padding:2.2rem 1.2rem 1.6rem;border-radius:0 0 28px 28px}
.header-row{display:flex;justify-content:space-between;align-items:center}
header h1{font-size:1.45rem;font-weight:800;letter-spacing:.5px}
header .sub{opacity:.88;font-size:.82rem;margin-top:.3rem}
.ring{width:74px;height:74px;border-radius:50%;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.25) 0);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring-in{width:58px;height:58px;border-radius:50%;background:#b23a34;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-in b{font-size:1.05rem}.ring-in span{font-size:.55rem;opacity:.8}
.stats{display:flex;gap:.6rem;margin-top:1.1rem}
.stat{flex:1;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);border-radius:14px;padding:.6rem .8rem}
.stat b{font-size:1.15rem;display:block}.stat span{font-size:.68rem;opacity:.85}
main{max-width:600px;margin:0 auto;padding:1rem .9rem 5rem}
.sec-title{font-size:1rem;font-weight:800;margin:1.4rem 0 .7rem;display:flex;align-items:center;gap:.45rem}
.sec-title .dot{width:9px;height:9px;border-radius:50%;background:var(--primary)}
.card{background:var(--card);border-radius:var(--radius);padding:1rem 1.05rem;margin-bottom:.85rem;box-shadow:0 1px 3px rgba(43,38,32,.06),0 4px 14px rgba(43,38,32,.05)}
.jp{cursor:pointer;border-bottom:1.5px dotted #d98a85;transition:background .15s;border-radius:4px;padding:0 1px}
.jp:active,.jp.speaking{background:var(--primary-soft)}
.jp.speaking{border-bottom:2px solid var(--primary)}
.rate-ctl{position:sticky;top:0;z-index:50;display:flex;gap:.4rem;align-items:center;justify-content:center;
  background:rgba(255,255,255,.94);padding:.45rem;border-radius:0 0 14px 14px;
  box-shadow:0 2px 12px rgba(0,0,0,.06);font-size:.82rem;color:var(--muted);margin:0 -.5rem .6rem}
.rate-ctl .rate-btn{border:1px solid #e8ddd2;background:#fff;color:var(--muted);border-radius:999px;
  padding:.28rem .8rem;font-size:.82rem;cursor:pointer}
.rate-ctl .rate-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
.reading{color:var(--muted);font-size:.85em}
.vocab-num{display:inline-flex;width:1.7rem;height:1.7rem;border-radius:50%;background:var(--primary-soft);color:var(--primary-deep);font-weight:800;font-size:.85rem;align-items:center;justify-content:center;margin-right:.5rem}
.vocab-zh{color:var(--primary-deep);font-weight:700}
.vocab-ex{margin:.35rem 0 0 2.2rem;font-size:.92rem;color:#5b544a}
.pattern{background:#2b2620;color:#f5e9d8;border-radius:12px;padding:.7rem .9rem;font-size:.95rem;margin:.5rem 0;font-family:inherit}
.g-title{font-weight:800;font-size:1.02rem;color:var(--primary-deep)}
.g-explain{margin:.4rem 0}
.g-ex{margin:.3rem 0 .3rem 1rem}
.practice{background:var(--primary-soft);border-radius:12px;padding:.7rem .9rem;margin-top:.6rem;font-size:.92rem}
.practice b{color:var(--primary-deep)}
.practice .ans{color:var(--muted);font-size:.85rem;margin-top:.25rem}
.kanji-row{display:flex;gap:.8rem;align-items:baseline;padding:.45rem 0;border-bottom:1px dashed #e8e0d2}
.kanji-row:last-child{border-bottom:none}
.kanji-ch{font-size:1.5rem;font-weight:800;min-width:2.2rem;text-align:center}
.kanji-rd{font-size:.82rem;color:var(--muted)}
.kanji-wd{font-size:.9rem}
.task{background:var(--card);border-radius:var(--radius);padding:1rem 1.05rem;margin-bottom:.85rem;box-shadow:0 1px 3px rgba(43,38,32,.06)}
.task b{color:var(--primary-deep)}
.nav{display:flex;justify-content:space-between;gap:.7rem;margin-top:1.4rem}
.nav a{flex:1;text-align:center;background:var(--card);border-radius:14px;padding:.8rem;text-decoration:none;color:var(--primary-deep);font-weight:700;box-shadow:0 1px 3px rgba(43,38,32,.08)}
.nav a.disabled{opacity:.35;pointer-events:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
@media(min-width:480px){.grid{grid-template-columns:1fr 1fr 1fr}}
.dcard{background:var(--card);border-radius:var(--radius);padding:.95rem 1rem;text-decoration:none;color:inherit;box-shadow:0 1px 3px rgba(43,38,32,.06),0 4px 14px rgba(43,38,32,.05);transition:transform .12s;display:block}
.dcard:active{transform:scale(.96)}
.dcard-top{display:flex;justify-content:space-between;align-items:baseline}
.dcard-day{font-weight:800;font-size:1.05rem;color:var(--primary)}
.dcard-wd{font-size:.75rem;color:var(--muted)}
.dcard-date{font-size:.72rem;color:var(--muted);margin-top:.15rem}
.dcard-theme{font-size:.76rem;color:#5b544a;margin-top:.35rem;line-height:1.35}
.chip{display:inline-block;font-size:.64rem;padding:.18rem .55rem;border-radius:99px;margin-top:.5rem;font-weight:600;background:var(--primary-soft);color:var(--primary-deep)}
footer{text-align:center;padding:1.5rem;color:var(--muted);font-size:.72rem}
.back{display:inline-block;color:#fff;opacity:.9;text-decoration:none;font-size:.85rem;margin-bottom:.6rem}
.day-meta{opacity:.88;font-size:.82rem;margin-top:.3rem}
h2.lesson-h{font-size:1.25rem;font-weight:800;margin-bottom:.2rem}
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div>
      <h1>📘 N5 → N4</h1>
      <div class="sub">九十二日達成計劃 ｜ 2026.10 → 2027.01</div>
    </div>
    <div class="ring" style="--p:2.2"><div class="ring-in"><b>2</b><span>/ 92</span></div></div>
  </div>
  <div class="stats">
    <div class="stat"><b>2</b><span>已收錄課堂</span></div>
    <div class="stat"><b>0</b><span>完成週數</span></div>
    <div class="stat"><b>90</b><span>剩餘日子</span></div>
  </div>
</header>
<main>
  <div class="card" style="margin-top:1rem">🔊 每課單字、例句撳一下即時讀出，再撳停止。建議配合道場App跟讀。</div>
  <div class="sec-title"><span class="dot"></span>全部課堂</div>
  <div class="grid">
    <a class="dcard" href="day2.html"><div class="dcard-top"><span class="dcard-day">Day 2</span><span class="dcard-wd">五</span></div><div class="dcard-date">2026-10-09</div><div class="dcard-theme">疑問句・打招呼</div></a><a class="dcard" href="day1.html"><div class="dcard-top"><span class="dcard-day">Day 1</span><span class="dcard-wd">四</span></div><div class="dcard-date">2026-10-08</div><div class="dcard-theme">問候・自我介紹</div></a>
  </div>
</main>
<footer>每晚 21:00 自動更新 ｜ Pison自編課程</footer>
<script>
var currentAudio=null, currentEl=null;
var playRate=1;
try{ var saved=parseFloat(localStorage.getItem('n5n4_rate')); if(saved>0) playRate=saved; }catch(e){}
function setRate(r){
  playRate=r;
  try{ localStorage.setItem('n5n4_rate',String(r)); }catch(e){}
  var btns=document.querySelectorAll('.rate-btn');
  for(var i=0;i<btns.length;i++){ btns[i].classList.toggle('active', parseFloat(btns[i].dataset.rate)===r); }
  stopAll();
}
function stopAll(){
  try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}
  if(currentAudio){ try{ currentAudio.pause(); }catch(e){} currentAudio=null; }
  if(currentEl){ currentEl.classList.remove('speaking'); currentEl=null; }
}
function speakFallback(el){
  try{
    if(!('speechSynthesis' in window)){alert('你個瀏覽器唔支援語音朗讀');return;}
    var t=(el.dataset.speak||el.textContent||'').replace(/\s+/g,' ').trim();
    if(!t) return;
    var u=new SpeechSynthesisUtterance(t);
    u.lang='ja-JP'; u.rate=0.85;
    currentEl=el; el.classList.add('speaking');
    var done=function(){ el.classList.remove('speaking'); if(currentEl===el) currentEl=null; };
    u.onend=done; u.onerror=done;
    speechSynthesis.speak(u);
  }catch(e){}
}
function speak(el){
  try{
    if(currentEl===el){ stopAll(); return; }
    stopAll();
    var au=el.dataset.audio;
    if(au){
      var a=new Audio(au);
      try{ a.playbackRate=playRate; }catch(e){}
      currentAudio=a; currentEl=el; el.classList.add('speaking');
      a.onended=function(){ stopAll(); };
      a.onerror=function(){ stopAll(); speakFallback(el); };
      var p=a.play();
      if(p&&p.catch){ p.catch(function(){ stopAll(); }); }
      return;
    }
    speakFallback(el);
  }catch(e){}
}
try{ setRate(playRate); }catch(e){}
</script>
</body>
</html>
